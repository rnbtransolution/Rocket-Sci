services:
  - type: web
    name: rocket-science-app
    env: node
    buildCommand: npm run build
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: KEEP_ALIVE
        value: true
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: SLIP_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: APP_URL
        sync: false
      - key: VITE_ADMIN_API_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_ADMIN_PASSCODE
        sync: false
