name = "rocket-science-cf-worker"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FinancialCoordinator"]

[[migrations]]
tag = "v2"
deleted_classes = ["FinancialCoordinator"]

# v3 — Authoritative strongly-consistent state store.
# Workers KV is eventually consistent: writes are only immediately visible at
# the location that served them, and other locations (LINE's region vs the
# operator's region) can keep serving the previous value for up to ~60s. That
# is what made Deposit/Withdraw appear late in the Admin Console.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["RocketStateDO"]

# ── Durable Object Bindings ──
# One instance, named `rocket-global-state`, is the single writer and reader for
# all live business state. Writes are immediately visible to every reader.
[[durable_objects.bindings]]
name = "ROCKET_STATE"
class_name = "RocketStateDO"

# ── Cloudflare KV Namespace Bindings ──
[[kv_namespaces]]
binding = "KV_CACHE"
id = "6f29b1fd16a142cfae401399fa7d08c3"
preview_id = "72455bbc581942d4b029d1a0fc124cbb"

[[kv_namespaces]]
binding = "KV_ORDERS"
id = "a9f088e6f5df4e00b90a9f135d938e96"
preview_id = "1f5f455b0af349088bab9d9e9dca48ca"

# ── Cloudflare Queues (High-Concurrency Async Decoupling) ──
[[queues.producers]]
binding = "LINE_EVENTS_QUEUE"
queue = "rocket-science-line-events"

[[queues.consumers]]
queue = "rocket-science-line-events"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "rocket-science-dlq"

# ── Environment Variables ──
[vars]
ENVIRONMENT = "production"
SPREADSHEET_ID = "1NaQbaUz8fcgd32sCAfxxKNBnpmFA5vu0_YVSehhdCEQ"
GAS_FALLBACK_URL = "https://script.google.com/macros/s/AKfycbxpJkoFdaDNgIzK6ihrRuZC8Khr-cGiaYah36qZ5MQkMOe88ldPxMZUt_Cxyyu9oU6nbA/exec"
